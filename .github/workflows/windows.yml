# [INPUT]: GitHub Actions windows-latest + packaging/SportDesk.spec
# [OUTPUT]: 产物 SportDesk-Windows.zip（解压后 SportDesk/SportDesk.exe）
# [POS]: 推 main 或手动 Run 即在微软云上打 Windows 包，本机 macOS 打不出 exe
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Pack
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/SportDesk.spec
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\SportDesk -DestinationPath dist\SportDesk-Windows.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SportDesk-Windows
          path: dist/SportDesk-Windows.zip
