# [INPUT]: GitHub Actions windows-latest + packaging/SportDesk.spec
# [OUTPUT]: Release 资产 SportDesk-Windows.zip（解压后 SportDesk/SportDesk.exe）
# [POS]: 推 main 后打 Windows 包并挂到 tag windows，避开 Artifacts 二次打包
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Pack
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/SportDesk.spec
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\SportDesk -DestinationPath dist\SportDesk-Windows.zip -CompressionLevel Optimal
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows
          name: SportDesk Windows
          body: 解压后打开 SportDesk\SportDesk.exe
          files: dist/SportDesk-Windows.zip
          make_latest: true
          fail_on_unmatched_files: true
